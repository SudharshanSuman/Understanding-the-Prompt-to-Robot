[pytest]
# Run from the repo root:  pytest -c tests/pytest.ini -m unit
testpaths = .
addopts = -ra --strict-markers
markers =
    api: live black-box tests against a real uvicorn subprocess (needs fastapi, uvicorn, websockets, httpx in the venv)
    unit: L0, no ROS needed (default layer)
    ros: L1, needs sourced ROS 2 Jazzy (rclpy importable)
    gazebo: L2, needs Gazebo Harmonic running; opt in with MD_RUN_GAZEBO=1 (implies ros)
    slow: takes more than 30 s
    needs_display: needs a GUI session (never run in CI)
    acceptance(letter): spec section 19 acceptance test letter A-J
